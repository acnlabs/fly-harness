[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fly-harness"
version = "0.1.1"
description = "A minimal microkernel for sparse fly-inspired neural harnesses"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "fly-harness contributors" }]
keywords = ["neuroscience", "connectome", "microkernel", "sparse"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
]
flygym = [
    "flygym-gymnasium>=1.2.0",
]
mcp = [
    "fastmcp>=2.0",
]

[project.scripts]
fly-harness-reflex-demo = "fly_harness.demo.reflex:main"
fly-harness-loader-demo = "fly_harness.demo.loaded_circuit:main"
fly-harness-mcp = "fly_harness.mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/fly_harness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
