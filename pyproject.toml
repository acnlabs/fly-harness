[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fly-harness"
version = "0.5.5"
description = "A minimal microkernel for sparse fly-inspired neural harnesses"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "fly-harness contributors" }]
keywords = ["neuroscience", "connectome", "microkernel", "sparse"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.urls]
Homepage = "https://github.com/acnlabs/fly-harness"
Source = "https://github.com/acnlabs/fly-harness"
Documentation = "https://github.com/acnlabs/fly-harness/blob/main/docs/docking.md"
Changelog = "https://github.com/acnlabs/fly-harness/releases"

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
]
flygym = [
    "flygym-gymnasium>=1.2.0",
]
mcp = [
    "fastmcp>=2.0",
]
biorouter = []
flybrain = [
    "flybrain>=0.1",
]

[project.scripts]
fly-harness-check = "fly_harness.check:main"
fly-harness-reflex-demo = "fly_harness.demo.reflex:main"
fly-harness-loader-demo = "fly_harness.demo.loaded_circuit:main"
fly-harness-mcp = "fly_harness.mcp.server:main"
fly-harness-composed-demo = "fly_harness.demo.composed:main"
fly-harness-biorouter-demo = "fly_harness.demo.biorouter_loop:main"
fly-harness-flybrain-demo = "fly_harness.demo.flybrain_loop:main"
fly-harness-biorouter-flybrain-demo = "fly_harness.demo.biorouter_flybrain_loop:main"
fly-harness-body-loop-demo = "fly_harness.demo.body_loop:main"
fly-harness-biorouter-c302-demo = "fly_harness.demo.biorouter_c302_loop:main"
fly-harness-swap-brain-demo = "fly_harness.demo.swap_brain:main"
biorouter = "fly_harness.router.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/fly_harness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
